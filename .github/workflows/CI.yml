name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # The ty/ruff tree is about 200 crates; a cold build takes a long time,
    # a warm one finishes in a few minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Go is only needed at build time: the typescript-go bridge is linked
      # statically, and users get a prebuilt wheel.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      # Pinned exactly: setup-uv stopped publishing floating major tags
      # after v7, so `@v9` does not resolve — only `@v9.0.0` does.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - uses: arduino/setup-task@v3

      # Without the cache every run would rebuild all of ty from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install
        run: task install

      - name: Lint
        run: task lint

      - name: Build
        run: task build

      - name: Stubs are up to date
        run: task stubs:check

      - name: Rust unit tests
        # The 137 tests Python cannot reach: the enum wire values, sort_paths,
        # the SCIP decoder, the dependency parsers. They ran in `task test` but
        # not here, so for a while nothing in CI executed them.
        run: task test:rust

      - name: Unit and API tests
        # Pure Python against the built module; needs no language toolchain.
        run: task unit

      - name: Golden fixtures
        # Structure-only comparison needs no toolchain; the resolved summary
        # skips Go and Rust here, since neither is installed in this job.
        run: task golden

      - name: Example
        run: task example
