name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # Дерево ty/ruff — около 200 крейтов; холодная сборка идёт долго,
    # прогретая укладывается в несколько минут.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Go нужен только при сборке: мост к typescript-go линкуется
      # статически, у пользователя wheel уже собран.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: arduino/setup-task@v2

      # Без кеша каждый прогон пересобирал бы весь ty с нуля.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install
        run: task install

      - name: Build
        run: task build

      - name: Stubs are up to date
        run: task stubs:check

      - name: Example
        run: task example
