name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # The ty/ruff tree is about 200 crates; a cold build takes a long time,
    # a warm one finishes in a few minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Go is only needed at build time: the typescript-go bridge is linked
      # statically, and users get a prebuilt wheel.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: arduino/setup-task@v2

      # Without the cache every run would rebuild all of ty from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install
        run: task install

      - name: Lint
        run: task lint

      - name: Build
        run: task build

      - name: Stubs are up to date
        run: task stubs:check

      - name: Example
        run: task example
