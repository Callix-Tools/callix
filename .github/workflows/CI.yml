name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # The ty/ruff tree is about 200 crates; a cold build takes a long time,
    # a warm one finishes in a few minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # rust-analyzer and the standard library's sources: the Rust resolver, which
      # the golden run and the accuracy suite both need and otherwise skip.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer, rust-src
      # Go builds the typescript-go bridge, which is linked statically, and is
      # what the Go resolver (go/packages) shells out to when the golden run and
      # the accuracy suite analyse Go.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      # Pinned exactly: setup-uv stopped publishing floating major tags
      # after v7, so `@v9` does not resolve — only `@v9.0.0` does.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
      - uses: arduino/setup-task@v3

      - name: Install
        run: task install

      - name: Python version for the cache key
        id: py
        run: echo "version=$(.venv/bin/python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"

      # Without the cache every run would rebuild all of ty from scratch.
      # The Python patch version is part of the key: pyo3's build script
      # records the interpreter's lib directory and is not re-run when only
      # the version behind `.venv/bin/python` changes, so a cache from
      # 3.13.17 linked stub_gen against a directory 3.13.18 no longer has.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          key: py${{ steps.py.outputs.version }}

      - name: Lint
        run: task lint

      - name: Build
        run: task build

      - name: Stubs are up to date
        run: task stubs:check

      - name: Rust unit tests
        # The 137 tests Python cannot reach: the enum wire values, sort_paths,
        # the SCIP decoder, the dependency parsers. They ran in `task test` but
        # not here, so for a while nothing in CI executed them.
        run: task test:rust

      - name: The CLI links no Python
        # The command line is the native build of the core: one binary that
        # needs nothing but libc. A pyo3 dependency creeping back in would
        # show up here before it showed up as a broken image.
        run: |
          ! ldd target/release/callix | grep -i python
          ! cargo tree -p callix-cli | grep -i pyo3

      - name: Unit and API tests
        # Pure Python against the built module; needs no language toolchain.
        run: task unit

      - name: Golden fixtures
        # Structure-only comparison needs no toolchain; the resolved summary
        # skips Go and Rust here, since neither is installed in this job.
        run: task golden

      - name: Example
        run: task example
