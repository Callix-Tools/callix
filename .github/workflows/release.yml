name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Version, changelog, tag. Wheels are built from that tag.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The last action here still on the node20 runtime, and its own
      # latest release: there is no newer major to move to. It only
      # downloads a binary, so the deprecation warning is all it costs.
      - uses: kenji-miyake/setup-git-cliff@v2

      - name: Determine next version
        id: version
        run: task release:version

      - name: Bump version
        run: task release:bump VERSION=${{ steps.version.outputs.version }}

      - name: Generate changelog
        run: task release:changelog TAG=${{ steps.version.outputs.tag }}

      - name: Commit and tag
        run: task release:commit TAG=${{ steps.version.outputs.tag }}

      - name: Push
        run: task release:push TAG=${{ steps.version.outputs.tag }}

  # ---------------------------------------------------------------------------
  # 2. Wheels. One wheel cannot cover every platform: ty and the Go bridge to
  #    typescript-go are linked inside. Thanks to abi3 the matrix runs over
  #    platforms only, not over Python versions — one wheel per platform
  #    covers 3.10 and everything after it.
  # ---------------------------------------------------------------------------
  wheels:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            libc: manylinux
          # A native ARM runner rather than QEMU inside the container: the ty
          # tree alone is ~200 crates, and emulating that would not fit the
          # timeout.
          - os: ubuntu-24.04-arm
            target: aarch64
            libc: manylinux
          # Alpine is half of the CI images in circulation, and a manylinux
          # wheel does not install there.
          - os: ubuntu-latest
            target: x86_64
            libc: musllinux
          - os: ubuntu-24.04-arm
            target: aarch64
            libc: musllinux
          - os: macos-latest
            target: aarch64
          # macos-latest is Apple Silicon, so the Intel wheel is cross-built;
          # build.rs passes the architecture on to Go and clang.
          - os: macos-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          # Without this the build container's own Rust decides, and it can be
          # older than the MSRV the embedded ty inherits from ruff (1.95 as of
          # ty 0.0.65). CI would stay green while the wheel matrix failed.
          rust-toolchain: stable
          # No Linux build container carries Go, and build.rs cannot build the
          # bridge without it, so Go goes in first. `musllinux_1_2` selects the
          # Alpine-based image; `auto` on macOS means no container at all.
          manylinux: >-
            ${{ matrix.libc == 'musllinux' && 'musllinux_1_2'
                || (startsWith(matrix.os, 'ubuntu') && '2_28' || 'auto') }}
          before-script-linux: |
            case "$(uname -m)" in
              x86_64)  goarch=amd64 ;;
              aarch64) goarch=arm64 ;;
              *) echo "unsupported container arch $(uname -m)" >&2; exit 1 ;;
            esac
            # cgo needs a C toolchain, and which package manager provides it
            # depends on the image: musllinux is Alpine, manylinux is not.
            if command -v apk >/dev/null; then
              apk add --no-cache gcc musl-dev git
            fi
            curl -sSL "https://go.dev/dl/go1.26.0.linux-${goarch}.tar.gz" \
              | tar -C /usr/local -xz
            export PATH=$PATH:/usr/local/go/bin
            go version

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.libc || 'native' }}
          path: dist/

  # ---------------------------------------------------------------------------
  # 3. The source distribution, so platforms outside the matrix can build.
  # ---------------------------------------------------------------------------
  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/

  # ---------------------------------------------------------------------------
  # 4. Publishing and the GitHub Release.
  # ---------------------------------------------------------------------------
  publish:
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Pinned exactly: setup-uv stopped publishing floating major tags
      # after v7, so `@v9` does not resolve — only `@v9.0.0` does.
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: kenji-miyake/setup-git-cliff@v2

      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: task release:publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task release:github TAG=${{ needs.version.outputs.tag }}

  # ---------------------------------------------------------------------------
  # 5. The command line as a plain binary. It links nothing but libc (the
  #    engine is native, with no interpreter inside), so a tarball is a
  #    complete install; the Go and Rust toolchains it can drive are the
  #    user's own. Built on the oldest hosted glibc so it loads on anything
  #    newer. Attached to the GitHub Release once `publish` has created it.
  # ---------------------------------------------------------------------------
  cli:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: macos-aarch64 }
          # macos-latest is Apple Silicon, so the Intel binary is cross-built;
          # build.rs passes the architecture on to Go and clang.
          - { os: macos-latest,     target: x86_64-apple-darwin,       name: macos-x86_64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release -p callix-cli --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${{ needs.version.outputs.version }}"
          dir="callix-${version}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/callix" LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          if command -v sha256sum >/dev/null; then
            sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          else
            shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
          fi

      - name: Smoke test
        run: |
          dir="callix-${{ needs.version.outputs.version }}-${{ matrix.name }}"
          # Only the host can run its own binary; the cross-built Intel one
          # runs under Rosetta on the Apple Silicon runner.
          "$dir/callix" --version
          "$dir/callix" analyze tests/fixtures/yaml -q > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.name }}
          path: |
            callix-*.tar.gz
            callix-*.tar.gz.sha256

  cli-release:
    needs: [version, publish, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: cli
          pattern: cli-*
          merge-multiple: true

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" cli/* --clobber --repo "$GITHUB_REPOSITORY"

  # ---------------------------------------------------------------------------
  # 6. Container images: ghcr.io/<owner>/callix, `full` and `slim`, for amd64
  #    and arm64.
  #
  #    The binary carries ty and the Go bridge, so an image is built per
  #    architecture on a native runner (emulating the ty tree would not fit the
  #    timeout), smoke-tested there, and pushed by digest. The manifest job
  #    then stitches the two digests into one multi-arch tag. Nothing here
  #    gates PyPI: the wheels publish regardless.
  # ---------------------------------------------------------------------------
  docker:
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [slim, full]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The ty tree plus the typescript-go checkout fill a hosted runner's disk.
      - name: Free disk space
        if: matrix.arch == 'amd64'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local daemon first and test that exact image; the push
      # below reuses every layer from this build.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: callix:ci
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Smoke test
        run: sh docker/smoke.sh callix:ci ${{ matrix.target }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: [version, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [slim, full]
    steps:
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `full` is the image people mean by "callix", so it owns the bare tags;
      # `slim` carries a suffix.
      - name: Tag and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          version="${{ needs.version.outputs.version }}"
          minor="${version%.*}"
          major="${version%%.*}"
          if [ "${{ matrix.target }}" = full ]; then
            suffix=""; floating=latest
          else
            suffix="-slim"; floating=slim
          fi
          docker buildx imagetools create \
            -t "$IMAGE:${version}${suffix}" \
            -t "$IMAGE:${minor}${suffix}" \
            -t "$IMAGE:${major}${suffix}" \
            -t "$IMAGE:${floating}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ needs.version.outputs.version }}${{ matrix.target == 'slim' && '-slim' || '' }}"
