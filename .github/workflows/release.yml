name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Version, changelog, tag. Wheels are built from that tag.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The last action here still on the node20 runtime, and its own
      # latest release: there is no newer major to move to. It only
      # downloads a binary, so the deprecation warning is all it costs.
      - uses: kenji-miyake/setup-git-cliff@v2

      - name: Determine next version
        id: version
        run: task release:version

      - name: Bump version
        run: task release:bump VERSION=${{ steps.version.outputs.version }}

      - name: Generate changelog
        run: task release:changelog TAG=${{ steps.version.outputs.tag }}

      - name: Commit and tag
        run: task release:commit TAG=${{ steps.version.outputs.tag }}

      - name: Push
        run: task release:push TAG=${{ steps.version.outputs.tag }}

  # ---------------------------------------------------------------------------
  # 2. Wheels. One wheel cannot cover every platform: ty and the Go bridge to
  #    typescript-go are linked inside. Thanks to abi3 the matrix runs over
  #    platforms only, not over Python versions — one wheel per platform
  #    covers 3.10 and everything after it.
  # ---------------------------------------------------------------------------
  wheels:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            libc: manylinux
          # A native ARM runner rather than QEMU inside the container: the ty
          # tree alone is ~200 crates, and emulating that would not fit the
          # timeout.
          - os: ubuntu-24.04-arm
            target: aarch64
            libc: manylinux
          # Alpine is half of the CI images in circulation, and a manylinux
          # wheel does not install there.
          - os: ubuntu-latest
            target: x86_64
            libc: musllinux
          - os: ubuntu-24.04-arm
            target: aarch64
            libc: musllinux
          - os: macos-latest
            target: aarch64
          # macos-latest is Apple Silicon, so the Intel wheel is cross-built;
          # build.rs passes the architecture on to Go and clang.
          - os: macos-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          # Without this the build container's own Rust decides, and it can be
          # older than the MSRV the embedded ty inherits from ruff (1.95 as of
          # ty 0.0.65). CI would stay green while the wheel matrix failed.
          rust-toolchain: stable
          # No Linux build container carries Go, and build.rs cannot build the
          # bridge without it, so Go goes in first. `musllinux_1_2` selects the
          # Alpine-based image; `auto` on macOS means no container at all.
          manylinux: >-
            ${{ matrix.libc == 'musllinux' && 'musllinux_1_2'
                || (startsWith(matrix.os, 'ubuntu') && '2_28' || 'auto') }}
          before-script-linux: |
            case "$(uname -m)" in
              x86_64)  goarch=amd64 ;;
              aarch64) goarch=arm64 ;;
              *) echo "unsupported container arch $(uname -m)" >&2; exit 1 ;;
            esac
            # cgo needs a C toolchain, and which package manager provides it
            # depends on the image: musllinux is Alpine, manylinux is not.
            if command -v apk >/dev/null; then
              apk add --no-cache gcc musl-dev git
            fi
            curl -sSL "https://go.dev/dl/go1.26.0.linux-${goarch}.tar.gz" \
              | tar -C /usr/local -xz
            export PATH=$PATH:/usr/local/go/bin
            go version

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.libc || 'native' }}
          path: dist/

  # ---------------------------------------------------------------------------
  # 3. The source distribution, so platforms outside the matrix can build.
  # ---------------------------------------------------------------------------
  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/

  # ---------------------------------------------------------------------------
  # 4. Publishing and the GitHub Release.
  # ---------------------------------------------------------------------------
  publish:
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Pinned exactly: setup-uv stopped publishing floating major tags
      # after v7, so `@v9` does not resolve — only `@v9.0.0` does.
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: kenji-miyake/setup-git-cliff@v2

      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: task release:publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task release:github TAG=${{ needs.version.outputs.tag }}
