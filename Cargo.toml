[package]
name = "callix"
version = "0.1.0"
edition = "2024"

[lib]
name = "callix"
# rlib is needed so the stub-generator binary can link against the library
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"

[dependencies]
indexmap = "2.14.0"
# indexmap keeps graph.nodes in insertion order, the way a Python dict is
pyo3 = { version = "0.29.0", features = ["abi3-py313", "indexmap"] }
pyo3-stub-gen = { version = "0.23.0", default-features = false }
serde_json = "1.0.151"
sha2 = "0.11.0"
streaming-iterator = "0.1.9"
thiserror = "2.0.19"
toml = "1.1.3"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5.0"

# --- ty: the type checker is linked in, not spawned as a subprocess --------
#
# The ty_ide / ty_project crates are marked publish = false and never reach
# crates.io, so they come from git. The rev is pinned to the commit matching
# the ty 0.0.52 tag — updating ty means changing rev in every entry below and
# verifying the result (see the README).

# Outside ruff's workspace the get-size2 features are not inherited and
# ruff_python_ast fails to build: the set from ruff/Cargo.toml is repeated
# here, and feature unification pulls it through.
[dependencies.get-size2]
# Exactly 0.10.0: in 0.10.3 get-size2 moved to compact_str 0.10 while ruff is
# built against 0.9 — otherwise GetSize is not implemented for CompactString.
version = "=0.10.0"
features = ["derive", "smallvec", "hashbrown", "compact-str", "ordermap", "thin-vec"]

[dependencies.ty_ide]
git = "https://github.com/astral-sh/ruff"
rev = "085c5cf8576712a9b161108dff2f9d3ea0d4569d"

[dependencies.ty_project]
git = "https://github.com/astral-sh/ruff"
rev = "085c5cf8576712a9b161108dff2f9d3ea0d4569d"

[dependencies.ruff_db]
git = "https://github.com/astral-sh/ruff"
rev = "085c5cf8576712a9b161108dff2f9d3ea0d4569d"
# "os" provides OsSystem — access to the real file system
features = ["os"]

[dependencies.ruff_source_file]
git = "https://github.com/astral-sh/ruff"
rev = "085c5cf8576712a9b161108dff2f9d3ea0d4569d"

[dependencies.ruff_text_size]
git = "https://github.com/astral-sh/ruff"
rev = "085c5cf8576712a9b161108dff2f9d3ea0d4569d"
