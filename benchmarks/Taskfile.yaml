version: "3"

vars:
  RUNNER: '{{.TASKFILE_DIR}}/run_benchmarks.py'
  MANIFEST: '{{.TASKFILE_DIR}}/projects.json'
  RESULTS: '{{.TASKFILE_DIR}}/results'
  WORKDIR: '{{default "/tmp/callix-bench" .WORKDIR}}'

tasks:
  list:
    desc: List the manifest's projects (BENCH_LANG=go for one language only)
    cmds:
      - python3 {{.RUNNER}} list --manifest {{.MANIFEST}} --lang "{{.BENCH_LANG}}"

  one:
    desc: Benchmark one project (requires PROJECT=owner/name)
    requires:
      vars: [PROJECT]
    cmds:
      - |
        name="{{.PROJECT}}"
        safe="${name//\//__}"
        mkdir -p {{.RESULTS}}
        uv run python {{.RUNNER}} analyze \
          --project "{{.PROJECT}}" \
          --manifest {{.MANIFEST}} \
          --workdir {{.WORKDIR}} \
          --out "{{.RESULTS}}/${safe}.json"

  run:
    desc: Benchmark every project in the manifest (BENCH_LANG=go narrows it to one language)
    cmds:
      - |
        mkdir -p {{.RESULTS}}
        python3 {{.RUNNER}} list --manifest {{.MANIFEST}} --lang "{{.BENCH_LANG}}" |
        while read -r name; do
          safe="${name//\//__}"
          echo "==> $name"
          # Each project is time-bounded: one hung resolver must not eat the
          # run and lose the results already collected.
          timeout --signal=TERM 1800 uv run python {{.RUNNER}} analyze \
            --project "$name" \
            --manifest {{.MANIFEST}} \
            --workdir {{.WORKDIR}} \
            --out "{{.RESULTS}}/${safe}.json" \
            || echo "!! $name timed out or failed"
        done

  render:
    desc: Render the results into the README table (VERSION=x.y.z for the caption)
    cmds:
      - |
        python3 {{.RUNNER}} render \
          --results {{.RESULTS}} \
          --manifest {{.MANIFEST}} \
          --readme {{.TASKFILE_DIR}}/../README.md \
          --version "{{default "dev" .VERSION}}"

  show:
    desc: Print the table without touching the README
    cmds:
      - |
        python3 {{.RUNNER}} render \
          --results {{.RESULTS}} \
          --manifest {{.MANIFEST}} \
          --version "{{default "dev" .VERSION}}" \
          --print
