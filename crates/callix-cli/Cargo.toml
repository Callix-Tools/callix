[package]
name = "callix-cli"
version = "1.2.0"
edition = "2024"
description = "The callix command line: analyse a project and export its graph as LSIF, CycloneDX and more"
license = "MIT"
publish = false

[[bin]]
name = "callix"
path = "src/main.rs"

[dependencies]
# No `python` feature: the engine is the native build, and nothing links libpython.
callix = { path = "../..", default-features = false }
callix-export = { path = "../callix-export" }
clap = { version = "4", features = ["derive", "wrap_help"] }
serde_json = { version = "1", features = ["preserve_order"] }
