[package]
name = "callix-compat"
version = "1.6.0"
edition = "2024"
description = "No-op stand-ins for the PyO3 attribute macros, so the core builds without Python"
license = "MIT"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
