[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "callix"
description = "Polyglot code analysis in Rust: Python, TypeScript, Go, Rust, PHP, C, C++ and YAML into a shared graph IR, with the type checkers linked in"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# The golden-file harness in tests/ is a script, not a pytest module; only the
# two suites below are collected.
testpaths = ["tests/unit", "tests/api"]
# So that the suites can share `tests/graphs.py` — the repo root has to be
# importable, since `tests/` is a plain directory and not a package.
pythonpath = ["."]

[tool.maturin]
python-source = "python"
module-name = "callix._core"
features = ["pyo3/extension-module"]
strip = true
include = [{ path = "python/callix/py.typed", format = "wheel" }]
