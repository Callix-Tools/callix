[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "callix"
description = "Polyglot code analysis in Rust: Python, TypeScript, Go and Rust into a shared graph IR, with the type checkers linked in"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = []

[tool.maturin]
python-source = "python"
module-name = "callix._core"
features = ["pyo3/extension-module"]
strip = true
include = [{ path = "python/callix/py.typed", format = "wheel" }]
