version: "3"

includes:
  bench:
    taskfile: benchmarks/Taskfile.yaml

vars:
  # The release profile is not incidental: in debug the embedded ty is about
  # 15x slower (resolving graphlens takes 12.5s against 0.8s) and the dev loop
  # turns into waiting. DEBUG=1 is only for a debugger or a quick compile
  # check. Every cargo task shares the profile so the ty tree — some 200
  # crates — is compiled once rather than once per profile.
  PROFILE: '{{if eq .DEBUG "1"}}{{else}}--release{{end}}'
  SCRIPT: '{{default "example/test.py" .CLI_ARGS}}'
  # ruff alone is 1.2 GB of checkout, so this is somewhere with room rather
  # than /tmp. Override per machine.
  BASELINE_WORKDIR: '{{default "/tmp/callix-baseline" .BASELINE_WORKDIR}}'

env:
  # abi3-py313 demands an interpreter >= 3.13, and pyo3 otherwise picks
  # whatever `python3` is first on PATH — on a CI runner that is often older.
  # `task install` creates this venv, so pointing pyo3 at it directly keeps
  # cargo independent of whether the venv happens to be activated.
  PYO3_PYTHON: '{{.TASKFILE_DIR}}/.venv/bin/python'

tasks:
  default:
    desc: Dev loop — build, stubs, example (DEBUG=1 for a debug build)
    cmds:
      - task: build
      - task: stubs
      - task: example

  install:
    desc: Create the venv and install maturin
    cmds:
      # The version is pinned rather than left to whatever `python3` resolves
      # to: abi3-py313 refuses to build against anything older, and uv fetches
      # 3.13 itself when the machine has none.
      # --allow-existing keeps a re-run idempotent instead of erroring out.
      - uv venv --python 3.13 --allow-existing
      - uv pip install maturin

  build:
    desc: Build the extension into the venv (DEBUG=1 for a debug build)
    cmds:
      - |
        if [[ "{{.DEBUG}}" == "1" ]]; then
          echo "!! debug build: the embedded ty will be very slow"
        fi
      - uv run maturin develop --uv {{.PROFILE}}

  stubs:
    desc: Regenerate the .pyi stubs from the pyo3-stub-gen annotations
    cmds:
      # Without pyo3/extension-module, or the binary will not link libpython.
      - cargo run --quiet {{.PROFILE}} --bin stub_gen

  stubs:check:
    desc: Check the committed .pyi files match the generated ones
    cmds:
      - task: stubs
      - git diff --exit-code -- python/callix

  example:
    desc: Run the example (task example -- example/foo.py)
    cmds:
      - uv run python {{.SCRIPT}}

  lint:
    desc: Run clippy (any warning is an error)
    cmds:
      - cargo clippy --all-targets {{.PROFILE}} -- -D warnings

  check:
    desc: Quick compile check without building the module
    cmds:
      - cargo check --all-targets {{.PROFILE}}

  test:
    desc: Golden fixture tests, cargo test, and a smoke run of the example
    cmds:
      - task: golden
      - cargo test {{.PROFILE}}
      - task: example

  golden:
    desc: Compare the fixture graphs against tests/golden (UPDATE=1 to rewrite)
    cmds:
      - uv run python tests/test_fixtures.py {{if eq .UPDATE "1"}}--update{{end}}

  baseline:
    desc: Compare real-project fingerprints (needs ~2GB of clones; not in CI)
    cmds:
      - uv run python tests/baseline.py compare --workdir {{.BASELINE_WORKDIR}} {{.CLI_ARGS}}

  baseline:capture:
    desc: Rewrite the real-project fingerprints, cloning what is missing
    cmds:
      - uv run python tests/baseline.py capture --clone --workdir {{.BASELINE_WORKDIR}} {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts (the typescript-go clone in .ts-go stays)
    cmds:
      - cargo clean

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------

  release:version:
    desc: Determine the next version from conventional commits
    cmds:
      - |
        NEXT=$(git cliff --bumped-version 2>/dev/null || echo "")
        if [[ -z "$NEXT" ]]; then
          echo "No tags yet, bootstrapping with v0.1.0"
          NEXT="v0.1.0"
        fi
        NEXT_CLEAN="${NEXT#v}"
        echo "Next version: $NEXT ($NEXT_CLEAN)"
        if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT_CLEAN" >> "$GITHUB_OUTPUT"
        fi

  release:bump:
    desc: Bump the version in Cargo.toml and Cargo.lock (requires VERSION=x.y.z)
    requires:
      vars: [VERSION]
    # The package version lives only in Cargo.toml: in pyproject.toml it is
    # `dynamic` and maturin reads it from there. The first `version =` inside
    # the [package] section is edited, so dependency versions stay untouched.
    cmds:
      - |
        python3 - "{{.VERSION}}" <<'PY'
        import pathlib, re, sys
        version = sys.argv[1]
        path = pathlib.Path("Cargo.toml")
        text = path.read_text(encoding="utf-8")
        head, sep, tail = text.partition("\n[")
        new_head, count = re.subn(
            r'(?m)^version = ".*"$', f'version = "{version}"', head, count=1
        )
        if count != 1:
            sys.exit("no version found in Cargo.toml's [package] section")
        path.write_text(new_head + sep + tail, encoding="utf-8")
        print(f"Cargo.toml -> {version}")
        PY
      - cargo update --workspace --quiet

  release:changelog:
    desc: Generate CHANGELOG.md (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - git cliff --tag {{.TAG}} --output CHANGELOG.md

  release:commit:
    desc: Commit the version bump and changelog, create the tag (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - |
        git add Cargo.toml Cargo.lock CHANGELOG.md
        git commit -m "chore(release): {{.TAG}}"
        git tag -a "{{.TAG}}" -m "Release {{.TAG}}"

  release:push:
    desc: Push the commit and tag to origin (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - git push origin main
      - git push origin {{.TAG}}

  release:sdist:
    desc: Build the source distribution
    cmds:
      - uv run maturin sdist --out dist

  release:wheel:
    desc: Build a wheel for the current platform
    cmds:
      - uv run maturin build --release --out dist

  release:publish:
    desc: Publish everything in dist/ to PyPI
    # Wheels are built by the matrix in release.yml and gathered into dist/
    # as artifacts: callix carries ty and the Go bridge inside, so one wheel
    # cannot cover every platform.
    cmds:
      - uv publish dist/*

  release:github:
    desc: Create the GitHub Release with changelog notes (requires TAG=vX.Y.Z)
    requires:
      vars: [TAG]
    cmds:
      - |
        git cliff --latest --strip all > /tmp/release-notes.md
        gh release create {{.TAG}} \
          --title {{.TAG}} \
          --notes-file /tmp/release-notes.md \
          dist/*
